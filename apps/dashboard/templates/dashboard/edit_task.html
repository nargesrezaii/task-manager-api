{% extends "dashboard/base.html" %}

{% block title %}
    Edit {{ task.title }} | Task Manager
{% endblock %}

{% block content %}

    <div class="task-form-container">

        <div class="task-form-card">

            <div class="task-form-header">
                <h1>Edit Task</h1>
                <p>Update the details of your task.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="task-form-actions">
                    <button type="submit" class="primary-button">
                        Save Changes
                    </button>

                    <a href="{% url 'task-detail' task.pk %}" class="secondary-button">
                        Cancel
                    </a>
                </div>
            </form>

        </div>

    </div>

{% endblock %}
