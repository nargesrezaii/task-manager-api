<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Task Manager{% endblock %}
    </title>
</head>

<body>

    <header>
        <nav>
            <a href="{% url 'dashboard' %}">
                Task Manager
            </a>

            {% if request.user.is_authenticated %}
                <a href="{% url 'dashboard' %}">
                    Dashboard
                </a>

                <a href="{% url 'create-task' %}">
                    Create Task
                </a>
            
                <a href="{% url 'profile' %}">
                    Profile
                </a>            

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
     
            {% else %}
                <a href="{% url 'login' %}">
                    Login
                </a>
                <a href="{% url 'register' %}">
                    Register
                </a>
            {% endif %}

        </nav>
    </header>

    <main>
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
