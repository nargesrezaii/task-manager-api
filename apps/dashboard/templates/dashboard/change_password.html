{% extends "dashboard/base.html" %}

{% block title %}
    Change Password | Task Manager
{% endblock %}

{% block content %}

    <h1>Change Password</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Change Password</button>
    </form>

    <a href="{% url 'profile' %}">
        Cancel
    </a>

{% endblock %}
