{% extends "dashboard/base.html" %}

{% block title %}
    Register | Task Manager
{% endblock %}

{% block content %}

    <h1>Create Account</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

{% endblock %}
