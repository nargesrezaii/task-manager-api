{% extends "dashboard/base.html" %}

{% block title %}
    Login | Task Manager
{% endblock %}

{% block content %}
    <div class="auth-container">
        <div class="auth-card">
            <h1>Login</h1>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

{% endblock %}
