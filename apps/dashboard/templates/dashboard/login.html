{% extends "dashboard/base.html" %}

{% block title %}
    Login | Task Manager
{% endblock %}

{% block content %}
    <h1>Login</h1>
        {% if error %}
            <p>{{ error }}</p>
        {% endif %}

    <form method="post">
        {% csrf_token %}

        <div>
            <label for="email">Email</label>

            <input type="email"
                   id="email"
                   name="email"
                   required>
        </div>

        <div>
            <label for="password">Password</label>

            <input type="password"
                   id="password"
                   name="password"
                   required>
        </div>

        <button type="submit">
            Login
        </button>
    </form>

{% endblock %}
